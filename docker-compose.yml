version: '3'
services:
  gateway:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3080:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro

  usage-worker:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: ["/app/llm-gateway-usage-worker"]
    volumes:
      - ./config.toml:/app/config.toml:ro

  audit-worker:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: ["/app/llm-gateway-audit-worker"]
    volumes:
      - ./config.toml:/app/config.toml:ro
