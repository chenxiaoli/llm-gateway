version: '3'
services:
  gateway:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:develop
    restart: unless-stopped
    ports:
      - "3080:8080"
    volumes:
      - /opt/dev/llm-gateway/config.toml:/app/config.toml:ro

  usage-worker:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:develop
    restart: unless-stopped
    entrypoint: ["/app/llm-gateway-usage-worker"]
    volumes:
      - /opt/dev/llm-gateway/config.toml:/app/config.toml:ro

  audit-worker:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:develop
    restart: unless-stopped
    entrypoint: ["/app/llm-gateway-audit-worker"]
    volumes:
      - /opt/dev/llm-gateway/config.toml:/app/config.toml:ro
