[workspace]
resolver = "2"
members = [
    "crates/gateway",
    "crates/api",
    "crates/provider",
    "crates/auth",
    "crates/ratelimit",
    "crates/billing",
    "crates/audit",
    "crates/storage",
    "crates/encryption",
    "crates/email",
    "crates/nats-publisher",
    "crates/usage-worker",
    "crates/audit-worker",
    "crates/org",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "migrate", "derive", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
tower = "0.5"
hyper = "1"
futures = "0.3"
base64 = "0.22"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-native-tls", "tokio1", "file-transport", "serde"] }
handlebars = "6.0"
llm-gateway-encryption = { path = "crates/encryption" }
llm-gateway-email = { path = "crates/email" }
