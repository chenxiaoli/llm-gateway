[server]
host = "0.0.0.0"
port = 8080
encryption_key = "your-32-byte-key-here-placeholder"

[auth]
jwt_secret = "change-me-in-production"
allow_registration = true

[database]
driver = "postgres"
url = "postgresql://llm_gateway:Xabc12345@10.0.17.3:5432/llm_gateway"

[rate_limit]
flush_interval_secs = 30
window_size_secs = 60

[upstream]
timeout_secs = 30

[nats]
url = "nats://nats:4222"
credentials_file = "nats.creds"

[audit]
retention_days = 90

[email]
# Transport: "smtp" for production, "file" for dev/tests (writes .eml to
# file_output_dir), "noop" for unit tests.
transport = "file"
from_address = "noreply@example.com"
from_name = "LLM Gateway"
file_output_dir = "./dev-emails"
# SMTP-specific (uncomment and set when transport = "smtp"):
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_username = "user"
# smtp_password = "pass"
smtp_use_tls = true
