version: '3'
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-llm_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_gateway} -d ${POSTGRES_DB:-llm_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - nats_data:/data
    networks:
      - internal

  gateway:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - nats
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
    networks:
      - internal

  usage-worker:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - nats
    entrypoint: ["/app/llm-gateway-usage-worker"]
    volumes:
      - ./config.toml:/app/config.toml:ro
    networks:
      - internal

  audit-worker:
    image: ghcr.io/${IMAGE_NAME:-chenxiaoli/llm-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - nats
    entrypoint: ["/app/llm-gateway-audit-worker"]
    volumes:
      - ./config.toml:/app/config.toml:ro
    networks:
      - internal

volumes:
  postgres_data:
  nats_data:

networks:
  internal:
